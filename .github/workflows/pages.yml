name: Deploy viewer to GitHub Pages

# Builds the version viewer from the spec on every push to main and publishes
# it to GitHub Pages. The generated HTML is never committed — it is produced
# here and deployed straight to Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install markdown

      - name: Build the viewer
        run: make -C viewer viewer

      - name: Assemble site (viewer as index.html)
        run: |
          mkdir -p _site
          cp capability-model-viewer.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
